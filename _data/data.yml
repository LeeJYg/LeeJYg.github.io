career-profile:
    title: Welcome
    summary: |
      Hello, my name is JooYoung Lee. I am an MS student at POSTECH Data Systems
      Laboratory, advised by Professor Wook-Shin Han, and I expect to receive my
      degree in August 2026.

      I work on the part where a language model becomes a service: deciding when
      retrieval is actually needed, checking a draft answer against its evidence
      before releasing it, and turning natural language into SQL that runs.

      My thesis is a negative result. I asked whether LLM-generated consumer
      personas can forecast demand for products with no sales history, tested it
      along four routes, and reported that they cannot.


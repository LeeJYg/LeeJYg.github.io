experiences:
    title: Experiences
    info:
      - role: Research Assistant
        time: 2024.02 - 2026.08
        company: POSTECH, Data Systems Laboratory
        details: |
          - **MCP-based ChatRPA ERP** (industry-academia project, team). Responsible for the
            NL2SQL agent and the sales-forecasting module. The target database was undecided
            when development had to start, so dialect-dependent syntax was isolated behind
            replaceable points rather than guessed; no rework was needed once PostgreSQL was
            fixed. Execution was verified against PostgreSQL.
          - **Event-ticker extraction from economic news** (industry-academia pilot).
            Responsible for the evaluation benchmark and performance measurement.
          - **LLM unlearning.** Found cases where existing unlearning methods stop working
            once the dataset's content and format differ from what they were tuned on.

      - role: Teaching Assistant, Algorithms
        time:
        company: POSTECH
        details: |
          Ran recitation sessions, graded assignments, and held office hours.

      - role: Lab Instructor, AI Specialist Program
        time:
        company: Samsung Electronics
        details: |
          Ran the hands-on lab sessions on RAG and MCP for practitioners across several
          cohorts, following the lecture portion of the curriculum.

projects:
    title: Projects
    intro:
    assignments:
      - title: three-step-qa
        link: "https://github.com/LeeJYg/three-step-qa"
        tagline: >
          Reference implementation of the three-step framework from our KDD Cup 2024 CRAG
          technical report. Skip retrieval when the model already knows the answer, keep only
          evidence that passes verification, and abstain when nothing supports the draft.
          Written for readability, not as the competition codebase.

      - title: LLM-Unlearning-Evaluation-for-Privacy-Information
        link: "https://github.com/LeeJYg/LLM-Unlearning-Evaluation-for-Privacy-Information"
        tagline: >
          A survey of privacy attacks on LLMs (extraction, membership inference), unlearning
          techniques, and how existing evaluation frameworks compare.

